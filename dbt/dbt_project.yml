name: wikiflow
version: "0.1.0"
config-version: 2

profile: wikiflow

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Creates the helper functions a warehouse needs before any model runs. A no-op on
# DuckDB, which has them built in (macros/cross_warehouse.sql).
on-run-start:
  - "{{ create_warehouse_functions() }}"

models:
  wikiflow:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
