# Kept in the repo rather than ~/.dbt so the project runs identically on a laptop
# and inside the Airflow container. Every environment-specific value is an env var
# with a working local default; no absolute paths (see ADR 0004).
wikiflow:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the dbt project directory. The warehouse is a single file, which
      # is most of the reason DuckDB was chosen - a reviewer can open it.
      path: "{{ env_var('WIKIFLOW_DUCKDB_PATH', 'warehouse/wikiflow.duckdb') }}"
      threads: 8
      extensions:
        - httpfs
      # DuckDB's modern credential mechanism. The older `SET s3_access_key_id` style
      # still works but is deprecated.
      secrets:
        - type: s3
          key_id: "{{ env_var('WIKIFLOW_S3_ACCESS_KEY', 'wikiflow') }}"
          secret: "{{ env_var('WIKIFLOW_S3_SECRET_KEY', 'wikiflow_dev_secret') }}"
          endpoint: "{{ env_var('WIKIFLOW_S3_ENDPOINT_HOSTPORT', 'localhost:9000') }}"
          region: "us-east-1"
          use_ssl: false
          url_style: "path"

    prod:
      type: duckdb
      # Relative to the dbt project directory. The warehouse is a single file, which
      # is most of the reason DuckDB was chosen - a reviewer can open it.
      path: "{{ env_var('WIKIFLOW_DUCKDB_PATH', 'warehouse/wikiflow.duckdb') }}"
      threads: 8
      extensions:
        - httpfs
      # DuckDB's modern credential mechanism. The older `SET s3_access_key_id` style
      # still works but is deprecated.
      secrets:
        - type: s3
          key_id: "{{ env_var('WIKIFLOW_S3_ACCESS_KEY', 'wikiflow') }}"
          secret: "{{ env_var('WIKIFLOW_S3_SECRET_KEY', 'wikiflow_dev_secret') }}"
          endpoint: "{{ env_var('WIKIFLOW_S3_ENDPOINT_HOSTPORT', 'localhost:9000') }}"
          region: "us-east-1"
          use_ssl: false
          url_style: "path"

    # The server warehouse (ADR 0008). The same models build here unchanged; the few
    # dialect differences are dispatched macros (macros/cross_warehouse.sql), and bronze
    # is loaded first by wikiflow.postgres_load, because Postgres cannot read Parquet
    # out of object storage the way DuckDB does.
    pg:
      type: postgres
      host: "{{ env_var('WIKIFLOW_PG_HOST', 'localhost') }}"
      port: "{{ env_var('WIKIFLOW_PG_PORT', '5433') | as_number }}"
      user: "{{ env_var('WIKIFLOW_PG_USER', 'wikiflow') }}"
      password: "{{ env_var('WIKIFLOW_PG_PASSWORD', 'wikiflow_dev_secret') }}"
      dbname: "{{ env_var('WIKIFLOW_PG_DATABASE', 'wikiflow') }}"
      schema: public
      threads: 4
