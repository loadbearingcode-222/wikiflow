# Run once after cloning:  uv run pre-commit install
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      # Enforces the .gitattributes rule. CRLF sneaking into a shell script is the
      # classic Windows-to-Linux-container failure, and it is invisible in a diff.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.ps1$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Catches unquoted variable expansions in scripts/ - which is exactly how a path
  # containing a space breaks things.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
